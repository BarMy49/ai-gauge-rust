[package]
name = "ai-gauge"
version = "0.3.1"
edition = "2021"
rust-version = "1.92"
description = "Native desktop AI usage and balance monitor"
license = "MIT"

[dependencies]
slint = { version = "=1.18.1", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-software", "accessibility"] }
sha2 = "0.10"
flate2 = "1"
tar = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
directories = "6"
fs2 = "0.4"
font8x8 = "0.3"
open = "5"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rust_decimal = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tungstenite = "0.26"
url = "2"
which = "8"
zeroize = "1"

[target.'cfg(windows)'.dependencies]
native-windows-gui = { version = "1.0.13", default-features = false, features = ["message-window", "tray-notification", "menu", "cursor", "animation-timer", "high-dpi"] }
keyring = { version = "3.6.3", default-features = false, features = ["windows-native"] }
winapi = { version = "0.3", features = ["winuser", "shellapi", "processthreadsapi", "libloaderapi", "wincon"] }

[target.'cfg(target_os = "linux")'.dependencies]
libloading = "0.8"
ksni = { version = "0.3", features = ["blocking"] }
keyring = { version = "3.6.3", default-features = false, features = ["async-secret-service", "tokio", "crypto-rust"] }

[build-dependencies]
slint-build = "=1.18.1"

[profile.release]
lto = false
strip = true
codegen-units = 8
panic = "abort"

[profile.dev]
debug = 0

[profile.release.package.ai-gauge]
codegen-units = 1
