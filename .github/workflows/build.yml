name: Native desktop binaries
on: [workflow_dispatch]
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --check
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo build --locked --release
      - name: Test desktop GUI startup
        timeout-minutes: 1
        shell: pwsh
        run: |
          $p = Start-Process -FilePath target/release/ai-gauge.exe -ArgumentList '--smoke-test' -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw 'GUI smoke test failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: AI-Gauge-Windows-x64
          path: target/release/ai-gauge.exe
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: sudo apt-get update && sudo apt-get install -y pkg-config libfontconfig1-dev libxkbcommon0 libxkbcommon-x11-0 libxcb-shape0 libxcb-xfixes0 xvfb
      - run: cargo fmt --check
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo build --locked --release
      - run: xvfb-run -a target/release/ai-gauge --smoke-test
      - uses: actions/upload-artifact@v4
        with:
          name: AI-Gauge-Linux-x64
          path: target/release/ai-gauge
